<div class="fixed bottom-6 right-6 z-50">
    <!-- Burbuja flotante -->
    <button (click)="toggleChat()" 
          class="w-14 h-14 flex items-center justify-center rounded-full bg-gradient-to-br from-blue-600 to-indigo-700 shadow-lg hover:from-blue-700 hover:to-indigo-800 transition-all duration-300 transform hover:scale-110 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-opacity-50">
    <span class="material-symbols-outlined text-white text-2xl">
      {{isChatOpen ? 'close' : 'music_note'}} <!-- Icono de atril musical -->
    </span>
  </button>
  
    <!-- Modal de chat -->
    @if (isChatOpen) {
      <div class="absolute bottom-16 right-0 w-80 bg-white rounded-t-xl rounded-bl-xl shadow-xl border border-gray-200 overflow-hidden">
        <!-- Cabecera del chat -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-4 py-3 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span class="material-symbols-outlined text-white">library_music</span>
            <h3 class="text-white font-medium">Asistencia musical</h3>
          </div>
          <button (click)="toggleChat()" class="text-white hover:text-gray-200">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
  
        <!-- Área de mensajes -->
        <div class="h-64 p-4 overflow-y-auto bg-gray-50">
          @for (message of messages(); track $index) {
            <div [ngClass]="{'flex justify-end mb-3': message.sender === 'user', 'mb-3': message.sender === 'bot'}" class="animate-fade-in">
              <div [ngClass]="{'bg-blue-100 rounded-l-lg rounded-br-lg': message.sender === 'bot', 'bg-indigo-600 text-white rounded-r-lg rounded-bl-lg': message.sender === 'user'}" 
                   class="px-3 py-2 max-w-xs sm:max-w-md">
               <markdown>{{message.text}}</markdown> 
              </div> 
            </div>
            
          }
          @if (isLoading()) {
            <div class="flex mb-3">
              <div class="bg-blue-100 rounded-l-lg rounded-br-lg px-3 py-2 max-w-xs">
                <div class="flex space-x-2">
                  <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                  <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                  <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                </div>
              </div>
            </div>
          }
        </div>
  
        <!-- Input para enviar mensajes -->
        <div class="border-t border-gray-200 bg-white p-3">
          <div class="flex items-center space-x-2">
            <input [(ngModel)]="newMessage" 
                   (keyup.enter)="sendMessage()" 
                   type="text" 
                   placeholder="Escribe tu mensaje..."
                   class="flex-1 px-3 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-sm">
            <button (click)="sendMessage()" 
                    class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-600 text-white hover:bg-blue-700 transition-colors">
              <span class="material-symbols-outlined">send</span>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
