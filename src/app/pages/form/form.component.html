    
<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 transition-opacity duration-300" (click)="closeForm(false)">
  <div class="bg-white p-6 rounded-xl shadow-lg relative w-full max-w-md transition-transform duration-300 transform scale-100" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Agregar Tarea</h2>

    <form [formGroup]="form()" class="space-y-4">
      <div>
        <p class="text-center text-emerald-500 text-sm">{{ succes }}</p>
        <label for="tarea" class="block text-sm font-medium text-gray-700">Tarea (Obligatorio)</label>
        <input formControlName="tarea" type="text" id="tarea" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Ej: escalas" required />
        <p class="text-center text-blue-600 text-sm mt-1">{{ mensaje }}</p>
      </div>

      <div>
        <label for="categoria" class="block text-sm font-medium text-gray-700">Categoría:</label>
        <div class="relative">
          <select formControlName="categoria" id="categoria" class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            <option>Técnica</option>
            <option>Repertorio</option>
            <option>Composición</option>
            <option>Ensayo</option>
            <option>Otro</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label for="message" class="block text-sm font-medium text-gray-700">Notas (Opcional)</label>
        <textarea formControlName="notas" id="message" rows="3" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Comentarios..."></textarea>
      </div>

      <div>
        <label for="link" class="block text-sm font-medium text-gray-700">Enlace (Opcional)</label>
        <input id="link" formControlName="enlace" type="url" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="https://ejemplo.com">
      </div>

      <div class="flex justify-end">
        <button type="button" (click)="lectura()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-md py-2 px-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
          Registrar tarea
        </button>
      </div>
    </form>
  </div>
</div>
