
    <!-- Botón flotante -->
<button 
(click)="togleModal()"
class="fixed bottom-24 right-6 z-40 p-4 rounded-full shadow-lg transition-all duration-300
       bg-gradient-to-br from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500
       hover:shadow-xl hover:scale-105"
[class.rotate-45]="isVisible()"
>
<svg xmlns="http://www.w3.org/2000/svg" 
     class="w-6 h-6 text-white transition-transform duration-300"
     fill="none" viewBox="0 0 24 24" stroke="currentColor">
  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
        d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
</svg>

<!-- Notificación de nuevas sugerencias (opcional) -->
@if (suggestion() && !isVisible()) {
  <span class="absolute top-0 right-0 w-3 h-3 bg-purple-500 rounded-full animate-ping"></span>
  <span class="absolute top-0 right-0 w-3 h-3 bg-indigo-500 rounded-full border border-white"></span>
}
</button>

<!-- Modal de sugerencias (tu contenido existente) -->
@if (isVisible()) {
<div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="relative w-full max-w-2xl rounded-xl bg-gradient-to-br from-gray-900 to-gray-800 border border-gray-700 shadow-2xl overflow-hidden">
          
          <!-- Botón cerrar -->
          <button (click)="togleModal()" 
                  class="absolute top-4 right-4 p-1 text-gray-400 hover:text-white rounded-full hover:bg-gray-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
      
          <!-- Header -->
          <div class="px-6 py-4 border-b border-gray-700 flex items-center gap-3">
            <div class="p-2 rounded-full bg-emerald-900/30 text-emerald-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
              </svg>
            </div>
            <h3 class="text-xl font-semibold text-white">Sugerencia Musical IA</h3>
          </div>
      
          <!-- Contenido -->
          <div class="p-6 max-h-[60vh] overflow-y-auto">
            @if (isLoading()) {
              <!-- Estado de carga -->
              <div class="flex flex-col items-center justify-center py-8">
                <div class="w-10 h-10 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-gray-400">Analizando tus tareas musicales...</p>
              </div>
            } @else {
              @if (suggestion()) {
                <!-- Sugerencia generada -->
                
                <div class="space-y-4">
                   
                  <div class="prose prose-invert max-w-none">
                   
                    <div class="p-4 bg-gray-400/50 rounded-lg whitespace-pre-line"><markdown>{{ suggestion() }}</markdown>  </div>
                    <div class="flex gap-3 pt-4">
                      <div class="flex justify-center">
                        <button (click)="aiSuggestion()" class="bg-blue-600 flex items-center px-4 py-2 hover:bg-slate-600 rounded-lg transition">Nueva sugerencia</button>
                      </div>
                    </div>
                    <!-- Acciones 
                    <div class="flex gap-3 pt-4">
                      <button (click)="copyToClipboard()"
                              class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        Copiar
                      </button>
                      
                      <button (click)="shareOnWhatsApp()"
                              class="flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-6.29-3.03c.545-1.37 1.582-2.517 2.983-2.793.604-.12 1.166.072 1.604.496.438.423.61 1.01.493 1.601-.116.59-.603 1.127-1.274 1.34-.672.213-1.423.064-2.01-.384-.586-.447-.925-1.19-.796-2.26zM20.852 11.78c-.038-3.93-3.217-7.13-7.147-7.17-3.932-.04-7.12 3.142-7.17 7.072-.05 3.93 3.142 7.12 7.072 7.17 1.61.016 3.138-.48 4.434-1.38l1.896 1.9c.17.17.452.183.635.01.184-.174.197-.457.027-.636l-1.85-1.85c1.1-1.38 1.66-3.01 1.603-4.706z"/>
                        </svg>
                        Compartir
                      </button>
                    </div>-->
                  </div>
                </div>
              } @else {
                <!-- Estado vacío -->
                <div class="text-center py-8 text-gray-400">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                  </svg>
                  <p class="mt-3 text-lg">No hay sugerencias generadas</p>
                  @if (isLoading()) {
                    <div class="flex mb-3">
                      <div class="bg-blue-100 rounded-l-lg rounded-br-lg px-3 py-2 max-w-xs">
                        <div class="flex space-x-2">
                          <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                          <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                          <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                        </div>
                      </div>
                    </div>
                  }
                  <div class="flex justify-center">
                    <button (click)="aiSuggestion()" class="bg-blue-600 flex items-center px-4 py-2 hover:bg-slate-600 rounded-lg transition">Crear sugerencia</button>
                  </div>
                  
                </div>
              }
            }
          </div>
        </div>
      </div>
</div>
}
